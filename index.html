<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G&M Planilha</title>
    
    <!-- Fontes: Pacifico (Título) e Inter (Textos e Números) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>G&M Planilha</h1>
    </header>

    <div class="container">
        
        <!-- Cards de Resumo no Topo -->
        <div class="cards-row">
            <div class="kpi-card">
                <h3>Total a Pagar no Mês</h3>
                <p id="kpi-total">R$ 0,00</p>
            </div>
            <div class="kpi-card">
                <h3>Lançamentos do Mês</h3>
                <p id="kpi-qtd">0</p>
            </div>
            <div class="kpi-card">
                <h3>Maior Parcela/Gasto</h3>
                <p id="kpi-maior">R$ 0,00</p>
            </div>
        </div>

        <div class="main-grid">
            
            <!-- Coluna Esquerda: Ações -->
            <div class="actions-col">
                <div class="box">
                    <h2>Adicionar Gasto</h2>
                    <div class="form-group">
                        <label>Descrição (Ex: Mercado, Nubank)</label>
                        <input type="text" id="desc" placeholder="O que você comprou?">
                    </div>
                    <div class="form-group">
                        <label>Valor Total (R$)</label>
                        <input type="number" id="valor" placeholder="0.00">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Parcelas</label>
                            <input type="number" id="parcelas" value="1" min="1">
                        </div>
                        <div class="form-group">
                            <label>Mês Inicial</label>
                            <input type="month" id="data-inicio" required>
                        </div>
                    </div>
                    <!-- Novo campo de Mês Final Automático -->
                    <div class="form-group">
                        <label>Mês Final (Calculado Automático)</label>
                        <input type="month" id="data-final" disabled style="background-color: #f1f5f9; cursor: not-allowed; color: #64748b;">
                    </div>
                    
                    <button id="add-btn" class="btn-success">Registrar Gasto</button>
                </div>

                <div class="box">
                    <h2>Filtro de Visualização</h2>
                    <div class="form-group">
                        <label>Consultar Mês</label>
                        <input type="month" id="mes-filtro">
                    </div>
                    <button id="filter-btn" class="btn-primary">Atualizar Dashboard</button>
                    <button id="clear-btn" class="btn-danger mt-sm">Apagar Todo o Histórico</button>
                </div>
            </div>

            <!-- Coluna Direita: Dados -->
            <div class="data-col">
                <div class="box">
                    <h2>Distribuição dos Gastos</h2>
                    <div class="chart-container">
                        <canvas id="graficoPizza"></canvas>
                    </div>
                </div>
                
                <div class="box">
                    <h2>Detalhes das Parcelas do Mês</h2>
                    <ul id="lista-despesas">
                        <!-- Inserido via JS -->
                    </ul>
                </div>
            </div>

        </div>
    </div>

    <script>
        let meuGrafico = null;
        let despesas = JSON.parse(localStorage.getItem('gm_despesas')) || [];

        // Função para calcular automaticamente o Mês Final
        function atualizarMesFinal() {
            const parcelasInput = document.getElementById('parcelas').value;
            const dataInicioInput = document.getElementById('data-inicio').value;
            const dataFinalInput = document.getElementById('data-final');

            if (!dataInicioInput || !parcelasInput) return;

            const parcelas = parseInt(parcelasInput);
            if (parcelas < 1) return;

            let [ano, mes] = dataInicioInput.split('-');
            ano = parseInt(ano);
            mes = parseInt(mes);

            // Subtrai 1 porque o mês atual já conta como a 1ª parcela
            let mesesAdicionais = parcelas - 1;
            
            let mesFinal = mes + mesesAdicionais;
            let anoFinal = ano;

            // Ajusta o ano se a soma dos meses passar de dezembro
            while (mesFinal > 12) {
                mesFinal -= 12;
                anoFinal++;
            }

            // Formata o mês com 2 dígitos (ex: 05, 11)
            const mesStr = mesFinal.toString().padStart(2, '0');
            dataFinalInput.value = `${anoFinal}-${mesStr}`;
        }

        // Adiciona "escutadores" para calcular sempre que o usuário digitar ou alterar
        document.getElementById('parcelas').addEventListener('input', atualizarMesFinal);
        document.getElementById('data-inicio').addEventListener('input', atualizarMesFinal);

        window.onload = () => {
            const hoje = new Date();
            const mesAtual = `${hoje.getFullYear()}-${(hoje.getMonth()+1).toString().padStart(2, '0')}`;
            document.getElementById('data-inicio').value = mesAtual;
            document.getElementById('mes-filtro').value = mesAtual;
            atualizarMesFinal(); // Calcula o mês final inicial
            carregarDespesas();
        };

        function salvarDados() {
            localStorage.setItem('gm_despesas', JSON.stringify(despesas));
        }

        document.getElementById('add-btn').addEventListener('click', () => {
            const desc = document.getElementById('desc').value;
            const valorTotal = parseFloat(document.getElementById('valor').value);
            const parcelas = parseInt(document.getElementById('parcelas').value);
            const dataInicio = document.getElementById('data-inicio').value;

            if(!desc || !valorTotal || !dataInicio || parcelas < 1) {
                return alert('Preencha todos os campos corretamente!');
            }

            const valorParcela = valorTotal / parcelas;
            let [ano, mes] = dataInicio.split('-');
            mes = parseInt(mes);
            ano = parseInt(ano);

            for (let i = 0; i < parcelas; i++) {
                let mesAtual = mes + i;
                let anoAtual = ano;
                
                while (mesAtual > 12) {
                    mesAtual -= 12;
                    anoAtual++;
                }

                const mesStr = mesAtual.toString().padStart(2, '0');
                const mesAno = `${anoAtual}-${mesStr}`;
                const sufixoParcela = parcelas > 1 ? ` (${i + 1}/${parcelas})` : '';

                despesas.push({
                    desc: desc + sufixoParcela,
                    valor: valorParcela,
                    mesAno: mesAno
                });
            }
            
            salvarDados(); 
            document.getElementById('desc').value = '';
            document.getElementById('valor').value = '';
            document.getElementById('parcelas').value = '1';
            atualizarMesFinal(); // Atualiza o campo final de volta pro padrão
            carregarDespesas(); 
        });

        document.getElementById('filter-btn').addEventListener('click', carregarDespesas);

        document.getElementById('clear-btn').addEventListener('click', () => {
            if(confirm('Tem certeza absoluta que deseja zerar todos os dados?')) {
                despesas = [];
                salvarDados();
                carregarDespesas();
            }
        });

        function carregarDespesas() {
            const mesFiltro = document.getElementById('mes-filtro').value;
            const despesasFiltradas = despesas.filter(d => d.mesAno === mesFiltro);
            
            const lista = document.getElementById('lista-despesas');
            lista.innerHTML = '';
            
            let total = 0;
            let maiorGasto = 0;
            const labelsGrafico = [];
            const dadosGrafico = [];

            despesasFiltradas.forEach((d) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${d.desc}</span> <strong>R$ ${d.valor.toFixed(2)}</strong>`;
                lista.appendChild(li);

                total += d.valor;
                if (d.valor > maiorGasto) maiorGasto = d.valor;
                
                const index = labelsGrafico.findIndex(label => label === d.desc);
                if(index === -1) {
                    labelsGrafico.push(d.desc);
                    dadosGrafico.push(d.valor);
                } else {
                    dadosGrafico[index] += d.valor;
                }
            });

            document.getElementById('kpi-total').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('kpi-qtd').innerText = despesasFiltradas.length;
            document.getElementById('kpi-maior').innerText = `R$ ${maiorGasto.toFixed(2)}`;

            if(despesasFiltradas.length === 0) {
                lista.innerHTML = '<li style="justify-content:center; color:#94a3b8; border:none;">Nenhum gasto para este mês.</li>';
            }

            atualizarGrafico(labelsGrafico, dadosGrafico);
        }

        function atualizarGrafico(labels, data) {
            const ctx = document.getElementById('graficoPizza').getContext('2d');
            if(meuGrafico) meuGrafico.destroy(); 

            if(data.length === 0) return;

            meuGrafico = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' }
                    }
                }
            });
        }
    </script>
</body>
</html>
