<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G&M Planilha</title>
    
    <!-- Fonte Pacifico para o Título -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    
    <!-- Chart.js para o Gráfico de Pizza -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Ligação ao seu ficheiro CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <h1>G&M Planilha</h1>
    </header>

    <div class="dashboard-container">
        
        <!-- Painel Lateral (Formulários) -->
        <aside class="sidebar">
            <div class="card">
                <h2>Adicionar Gasto</h2>
                <div class="input-group">
                    <label>Descrição</label>
                    <input type="text" id="desc" placeholder="Ex: Mercado">
                </div>
                <div class="input-group">
                    <label>Valor Total (R$)</label>
                    <input type="number" id="valor" placeholder="0.00">
                </div>
                <div class="input-group-row">
                    <div class="input-group">
                        <label>Parcelas</label>
                        <input type="number" id="parcelas" value="1" min="1">
                    </div>
                    <div class="input-group">
                        <label>Mês Inicial</label>
                        <input type="month" id="data-inicio" required>
                    </div>
                </div>
                <button id="add-btn" class="btn-primary">Adicionar Gasto</button>
            </div>

            <div class="card">
                <h2>Controle e Filtros</h2>
                <div class="input-group">
                    <label>Mês de Referência</label>
                    <input type="month" id="mes-filtro">
                </div>
                <button id="filter-btn" class="btn-secondary">Filtrar Mês</button>
                <button id="clear-btn" class="btn-danger">Apagar Todos os Dados</button>
            </div>
        </aside>

        <!-- Área Principal (Resumos e Gráficos) -->
        <main class="main-content">
            
            <!-- Cartões de Resumo (Valores) -->
            <div class="kpi-grid">
                <div class="kpi-card">
                    <h3>Total do Mês</h3>
                    <p id="kpi-total">R$ 0,00</p>
                </div>
                <div class="kpi-card">
                    <h3>Lançamentos</h3>
                    <p id="kpi-qtd">0</p>
                </div>
                <div class="kpi-card">
                    <h3>Maior Gasto</h3>
                    <p id="kpi-maior">R$ 0,00</p>
                </div>
            </div>

            <div class="content-grid">
                <!-- Gráfico -->
                <div class="card chart-container">
                    <h2>Distribuição de Gastos</h2>
                    <div class="canvas-wrapper">
                        <canvas id="graficoPizza"></canvas>
                    </div>
                </div>

                <!-- Lista de Despesas -->
                <div class="card list-container">
                    <h2>Resumo Detalhado</h2>
                    <ul id="lista-despesas">
                        <!-- Itens inseridos via JS -->
                    </ul>
                </div>
            </div>

        </main>
    </div>

    <script>
        let meuGrafico = null;
        let despesas = JSON.parse(localStorage.getItem('gm_despesas')) || [];

        window.onload = () => {
            const hoje = new Date();
            const mesAtual = `${hoje.getFullYear()}-${(hoje.getMonth()+1).toString().padStart(2, '0')}`;
            document.getElementById('data-inicio').value = mesAtual;
            document.getElementById('mes-filtro').value = mesAtual;
            carregarDespesas();
        };

        function salvarDados() {
            localStorage.setItem('gm_despesas', JSON.stringify(despesas));
        }

        document.getElementById('add-btn').addEventListener('click', () => {
            const desc = document.getElementById('desc').value;
            const valorTotal = parseFloat(document.getElementById('valor').value);
            const parcelas = parseInt(document.getElementById('parcelas').value);
            const dataInicio = document.getElementById('data-inicio').value;

            if(!desc || !valorTotal || !dataInicio || parcelas < 1) {
                return alert('Preencha todos os campos corretamente!');
            }

            const valorParcela = valorTotal / parcelas;
            let [ano, mes] = dataInicio.split('-');
            mes = parseInt(mes);
            ano = parseInt(ano);

            for (let i = 0; i < parcelas; i++) {
                let mesAtual = mes + i;
                let anoAtual = ano;
                
                while (mesAtual > 12) {
                    mesAtual -= 12;
                    anoAtual++;
                }

                const mesStr = mesAtual.toString().padStart(2, '0');
                const mesAno = `${anoAtual}-${mesStr}`;
                const sufixoParcela = parcelas > 1 ? ` (${i + 1}/${parcelas})` : '';

                despesas.push({
                    desc: desc + sufixoParcela,
                    valor: valorParcela,
                    mesAno: mesAno
                });
            }
            
            salvarDados(); 
            document.getElementById('desc').value = '';
            document.getElementById('valor').value = '';
            document.getElementById('parcelas').value = '1';
            carregarDespesas(); 
        });

        document.getElementById('filter-btn').addEventListener('click', carregarDespesas);

        document.getElementById('clear-btn').addEventListener('click', () => {
            if(confirm('Tem certeza de que deseja apagar todos os gastos registrados?')) {
                despesas = [];
                salvarDados();
                carregarDespesas();
            }
        });

        function carregarDespesas() {
            const mesFiltro = document.getElementById('mes-filtro').value;
            const despesasFiltradas = despesas.filter(d => d.mesAno === mesFiltro);
            
            const lista = document.getElementById('lista-despesas');
            lista.innerHTML = '';
            
            let total = 0;
            let maiorGasto = 0;
            const labelsGrafico = [];
            const dadosGrafico = [];

            despesasFiltradas.forEach((d) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${d.desc}</span> <strong>R$ ${d.valor.toFixed(2)}</strong>`;
                lista.appendChild(li);

                total += d.valor;
                if (d.valor > maiorGasto) maiorGasto = d.valor;
                
                const index = labelsGrafico.findIndex(label => label === d.desc);
                if(index === -1) {
                    labelsGrafico.push(d.desc);
                    dadosGrafico.push(d.valor);
                } else {
                    dadosGrafico[index] += d.valor;
                }
            });

            // Atualiza os Cartões de Resumo (KPIs)
            document.getElementById('kpi-total').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('kpi-qtd').innerText = despesasFiltradas.length;
            document.getElementById('kpi-maior').innerText = `R$ ${maiorGasto.toFixed(2)}`;

            if(despesasFiltradas.length === 0) {
                lista.innerHTML = '<li style="justify-content:center; color:#94a3b8;">Nenhum gasto neste mês</li>';
            }

            atualizarGrafico(labelsGrafico, dadosGrafico);
        }

        function atualizarGrafico(labels, data) {
            const ctx = document.getElementById('graficoPizza').getContext('2d');
            if(meuGrafico) meuGrafico.destroy(); 

            if(data.length === 0) return;

            meuGrafico = new Chart(ctx, {
                type: 'doughnut', // Mudado para 'doughnut' para um visual mais moderno de dashboard
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' }
                    }
                }
            });
        }
    </script>
</body>
</html>
