<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G&M Planilha</title>
    <!-- Fonte Pacifico para o Título -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <!-- Chart.js para o Gráfico de Pizza -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Coloque o seu CSS aqui */
        h1 {
            font-family: 'Pacifico', cursive;
        }
    </style>
</head>
<body>

    <h1>G&M Planilha</h1>

    <!-- Seção Principal da Aplicação (Agora visível por padrão) -->
    <div id="app-section">
        
        <h2>Adicionar Gasto</h2>
        <input type="text" id="desc" placeholder="Descrição do Gasto">
        <input type="number" id="valor" placeholder="Valor Total (R$)">
        <input type="number" id="parcelas" placeholder="Qtd Parcelas" value="1" min="1">
        <input type="month" id="data-inicio" required>
        <button id="add-btn">Adicionar</button>

        <h2>Controle Financeiro</h2>
        <input type="month" id="mes-filtro">
        <button id="filter-btn">Filtrar Mês</button>
        <button id="clear-btn" style="background-color: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-top: 10px;">Apagar Dados Locais</button>

        <!-- Gráfico de Pizza -->
        <div style="max-width: 400px; margin-top: 20px;">
            <canvas id="graficoPizza"></canvas>
        </div>

        <!-- Lista de Gastos -->
        <h2>Resumo do Mês</h2>
        <ul id="lista-despesas"></ul>
    </div>

    <!-- Lógica do Sistema usando LocalStorage (sem banco de dados) -->
    <script>
        let meuGrafico = null;
        
        // Recupera os dados salvos no navegador ou inicia um array vazio
        let despesas = JSON.parse(localStorage.getItem('gm_despesas')) || [];

        // Inicializa o mês de filtro com o mês atual ao carregar a página
        window.onload = () => {
            const hoje = new Date();
            const mesAtual = `${hoje.getFullYear()}-${(hoje.getMonth()+1).toString().padStart(2, '0')}`;
            document.getElementById('data-inicio').value = mesAtual;
            document.getElementById('mes-filtro').value = mesAtual;
            carregarDespesas();
        };

        // Função para salvar no LocalStorage
        function salvarDados() {
            localStorage.setItem('gm_despesas', JSON.stringify(despesas));
        }

        // Adicionar Gasto e Calcular Parcelas
        document.getElementById('add-btn').addEventListener('click', () => {
            const desc = document.getElementById('desc').value;
            const valorTotal = parseFloat(document.getElementById('valor').value);
            const parcelas = parseInt(document.getElementById('parcelas').value);
            const dataInicio = document.getElementById('data-inicio').value;

            if(!desc || !valorTotal || !dataInicio || parcelas < 1) {
                return alert('Preencha todos os campos corretamente!');
            }

            const valorParcela = valorTotal / parcelas;
            let [ano, mes] = dataInicio.split('-');
            mes = parseInt(mes);
            ano = parseInt(ano);

            for (let i = 0; i < parcelas; i++) {
                let mesAtual = mes + i;
                let anoAtual = ano;
                
                while (mesAtual > 12) {
                    mesAtual -= 12;
                    anoAtual++;
                }

                const mesStr = mesAtual.toString().padStart(2, '0');
                const mesAno = `${anoAtual}-${mesStr}`;
                const sufixoParcela = parcelas > 1 ? ` (${i + 1}/${parcelas})` : '';

                // Adiciona a despesa ao array local
                despesas.push({
                    desc: desc + sufixoParcela,
                    valor: valorParcela,
                    mesAno: mesAno
                });
            }
            
            salvarDados(); // Salva no navegador
            alert('Gasto adicionado com sucesso!');
            
            // Limpa os campos
            document.getElementById('desc').value = '';
            document.getElementById('valor').value = '';
            document.getElementById('parcelas').value = '1';
            
            carregarDespesas(); // Atualiza a tela
        });

        document.getElementById('filter-btn').addEventListener('click', carregarDespesas);

        // Botão para limpar os dados de teste
        document.getElementById('clear-btn').addEventListener('click', () => {
            if(confirm('Tem certeza que deseja apagar todos os gastos cadastrados?')) {
                despesas = [];
                salvarDados();
                carregarDespesas();
            }
        });

        // Carregar Gastos e Gerar Gráfico baseando-se no array local
        function carregarDespesas() {
            const mesFiltro = document.getElementById('mes-filtro').value;
            
            // Filtra o array pelo mês selecionado
            const despesasFiltradas = despesas.filter(d => d.mesAno === mesFiltro);
            
            const lista = document.getElementById('lista-despesas');
            lista.innerHTML = '';
            
            let total = 0;
            const labelsGrafico = [];
            const dadosGrafico = [];

            despesasFiltradas.forEach((d) => {
                const li = document.createElement('li');
                li.innerText = `${d.desc} - R$ ${d.valor.toFixed(2)}`;
                lista.appendChild(li);

                total += d.valor;
                
                // Prepara os dados para o gráfico agrupando descrições iguais
                const index = labelsGrafico.findIndex(label => label === d.desc);
                if(index === -1) {
                    labelsGrafico.push(d.desc);
                    dadosGrafico.push(d.valor);
                } else {
                    dadosGrafico[index] += d.valor;
                }
            });

            const totalLi = document.createElement('li');
            totalLi.innerHTML = `<br><strong>TOTAL DO MÊS: R$ ${total.toFixed(2)}</strong>`;
            lista.appendChild(totalLi);

            atualizarGrafico(labelsGrafico, dadosGrafico);
        }

        // Configuração do Chart.js
        function atualizarGrafico(labels, data) {
            const ctx = document.getElementById('graficoPizza').getContext('2d');
            
            if(meuGrafico) meuGrafico.destroy(); // Destrói o gráfico anterior

            // Se não houver dados, não renderiza um gráfico vazio
            if(data.length === 0) return;

            meuGrafico = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#E7E9ED', '#71B37C'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
