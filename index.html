<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G&M Planilha</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>G&M Planilha</h1>
    </header>

    <div class="container">
        <!-- Cards de Resumo no Topo -->
        <div class="cards-row">
            <div class="kpi-card" style="border-left-color: #2563eb;">
                <h3>Total de Gastos no Mês</h3>
                <p id="kpi-total">R$ 0,00</p>
            </div>
            <div class="kpi-card" style="border-left-color: #10b981;">
                <h3>Renda do Mês</h3>
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 5px;">
                    <span style="font-size: 1.5rem; font-weight: 700;">R$</span>
                    <input type="text" id="input-renda" value="0,00" style="font-size: 1.5rem; font-weight: 700; padding: 2px 8px; height: 40px;" placeholder="0,00">
                </div>
            </div>
            <div class="kpi-card" style="border-left-color: #8b5cf6;" id="card-saldo-container">
                <h3>Saldo Restante</h3>
                <p id="kpi-saldo">R$ 0,00</p>
            </div>
            <div class="kpi-card" style="border-left-color: #f59e0b;">
                <h3>Maior Parcela/Gasto</h3>
                <p id="kpi-maior">R$ 0,00</p>
            </div>
        </div>

        <div class="main-grid">
            <div class="actions-col">
                <div class="box">
                    <h2>Adicionar Gasto</h2>
                    <div class="form-group">
                        <label>Descrição (Ex: Apartamento, Nubank)</label>
                        <input type="text" id="desc" placeholder="O que você comprou?">
                    </div>

                    <!-- Novo campo de Categoria -->
                    <div class="form-group">
                        <label>Categoria</label>
                        <select id="categoria">
                            <option value="Moradia">🏠 Moradia</option>
                            <option value="Transporte">🚗 Transporte</option>
                            <option value="Alimentação">🛒 Alimentação</option>
                            <option value="Lazer">🎉 Lazer</option>
                            <option value="Contas">💡 Contas Básicas</option>
                            <option value="Outros" selected>📦 Outros</option>
                        </select>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Valor Total (R$)</label>
                            <input type="text" id="valor" placeholder="Opcional">
                        </div>
                        <div class="form-group">
                            <label>Valor da Parcela (R$)</label>
                            <input type="text" id="valor-parcela" placeholder="Ex: 945,00">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Qtd Parcelas</label>
                            <input type="number" id="parcelas" value="1" min="1">
                        </div>
                        <div class="form-group">
                            <label>Mês Inicial</label>
                            <input type="month" id="data-inicio" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Mês Final (Automático)</label>
                            <input type="month" id="data-final" disabled style="background-color: #f1f5f9; cursor: not-allowed; color: #64748b;">
                        </div>
                        <div class="form-group">
                            <label>Cor no Gráfico</label>
                            <input type="color" id="cor-gasto" value="#2563eb" style="height: 42px; padding: 4px; cursor: pointer;">
                        </div>
                    </div>
                    
                    <button id="add-btn" class="btn-success">Registrar Gasto</button>
                </div>

                <div class="box">
                    <h2>Filtro de Visualização</h2>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Selecione o Mês para Consultar</label>
                        <input type="month" id="mes-filtro" style="border: 2px solid var(--primary);">
                    </div>
                </div>
            </div>

            <div class="data-col">
                <div class="box">
                    <h2>Distribuição dos Gastos</h2>
                    <div class="chart-container">
                        <canvas id="graficoPizza"></canvas>
                    </div>
                </div>
                
                <div class="box">
                    <h2>Detalhes das Parcelas do Mês</h2>
                    <ul id="lista-despesas">
                        <!-- Inserido via JS -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        let meuGrafico = null;
        let despesas = JSON.parse(localStorage.getItem('gm_despesas')) || [];
        let rendasMensais = JSON.parse(localStorage.getItem('gm_rendas')) || {};

        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function converterParaNumero(valorString) {
            if (!valorString) return 0;
            let limpo = String(valorString).replace(/[^\d,]/g, '');
            limpo = limpo.replace(',', '.');
            return parseFloat(limpo) || 0;
        }

        const inputTotal = document.getElementById('valor');
        const inputParcela = document.getElementById('valor-parcela');
        const inputQtd = document.getElementById('parcelas');
        const inputRenda = document.getElementById('input-renda');

        inputTotal.addEventListener('blur', () => {
            const total = converterParaNumero(inputTotal.value);
            const qtd = parseInt(inputQtd.value) || 1;
            if (total > 0) {
                inputTotal.value = formatarMoeda(total);
                inputParcela.value = formatarMoeda(total / qtd);
            }
        });

        inputParcela.addEventListener('blur', () => {
            const parcela = converterParaNumero(inputParcela.value);
            const qtd = parseInt(inputQtd.value) || 1;
            if (parcela > 0) {
                inputParcela.value = formatarMoeda(parcela);
                inputTotal.value = formatarMoeda(parcela * qtd);
            }
        });

        inputQtd.addEventListener('input', () => {
            const total = converterParaNumero(inputTotal.value);
            const qtd = parseInt(inputQtd.value) || 1;
            if (total > 0) {
                inputParcela.value = formatarMoeda(total / qtd);
            }
            atualizarMesFinal();
        });

        inputRenda.addEventListener('blur', () => {
            const mesFiltro = document.getElementById('mes-filtro').value;
            const valorRenda = converterParaNumero(inputRenda.value);
            inputRenda.value = formatarMoeda(valorRenda);
            
            rendasMensais[mesFiltro] = valorRenda;
            localStorage.setItem('gm_rendas', JSON.stringify(rendasMensais));
            carregarDespesas();
        });

        function atualizarMesFinal() {
            const parcelasInput = document.getElementById('parcelas').value;
            const dataInicioInput = document.getElementById('data-inicio').value;
            const dataFinalInput = document.getElementById('data-final');

            if (!dataInicioInput || !parcelasInput) return;

            const parcelas = parseInt(parcelasInput);
            if (parcelas < 1) return;

            let [ano, mes] = dataInicioInput.split('-');
            ano = parseInt(ano);
            mes = parseInt(mes);

            let mesesAdicionais = parcelas - 1;
            let mesFinal = mes + mesesAdicionais;
            let anoFinal = ano;

            while (mesFinal > 12) {
                mesFinal -= 12;
                anoFinal++;
            }

            const mesStr = mesFinal.toString().padStart(2, '0');
            dataFinalInput.value = `${anoFinal}-${mesStr}`;
        }

        document.getElementById('data-inicio').addEventListener('input', atualizarMesFinal);
        document.getElementById('mes-filtro').addEventListener('input', carregarDespesas);

        window.onload = () => {
            const hoje = new Date();
            const mesAtual = `${hoje.getFullYear()}-${(hoje.getMonth()+1).toString().padStart(2, '0')}`;
            document.getElementById('data-inicio').value = mesAtual;
            document.getElementById('mes-filtro').value = mesAtual;
            atualizarMesFinal();
            carregarDespesas();
        };

        function salvarDados() {
            localStorage.setItem('gm_despesas', JSON.stringify(despesas));
        }

        document.getElementById('add-btn').addEventListener('click', () => {
            const desc = document.getElementById('desc').value;
            const categoria = document.getElementById('categoria').value;
            const parcelas = parseInt(document.getElementById('parcelas').value);
            const dataInicio = document.getElementById('data-inicio').value;
            const valorParcela = converterParaNumero(inputParcela.value);
            const corGasto = document.getElementById('cor-gasto').value;

            if(!desc || valorParcela <= 0 || !dataInicio || parcelas < 1) {
                return alert('Preencha os campos de descrição, valor e data corretamente!');
            }

            let [ano, mes] = dataInicio.split('-');
            mes = parseInt(mes);
            ano = parseInt(ano);

            const idCompra = Date.now().toString();

            for (let i = 0; i < parcelas; i++) {
                let mesAtual = mes + i;
                let anoAtual = ano;
                
                while (mesAtual > 12) {
                    mesAtual -= 12;
                    anoAtual++;
                }

                const mesStr = mesAtual.toString().padStart(2, '0');
                const mesAno = `${anoAtual}-${mesStr}`;
                const sufixoParcela = parcelas > 1 ? ` (${i + 1}/${parcelas})` : '';

                despesas.push({
                    id: idCompra,
                    desc: desc + sufixoParcela,
                    categoria: categoria,
                    valor: valorParcela,
                    mesAno: mesAno,
                    nomeOriginal: desc,
                    cor: corGasto
                });
            }
            
            salvarDados(); 
            document.getElementById('desc').value = '';
            document.getElementById('valor').value = '';
            document.getElementById('valor-parcela').value = '';
            document.getElementById('parcelas').value = '1';
            atualizarMesFinal(); 
            carregarDespesas(); 
        });

        function apagarItem(id, nomeProduto) {
            if(confirm(`Tem certeza que deseja apagar "${nomeProduto}" e TODAS as suas parcelas?`)) {
                despesas = despesas.filter(d => d.id !== id);
                salvarDados();
                carregarDespesas();
            }
        }

        function carregarDespesas() {
            const mesFiltro = document.getElementById('mes-filtro').value;
            const rendaAtual = rendasMensais[mesFiltro] || 0;
            inputRenda.value = formatarMoeda(rendaAtual);

            const despesasFiltradas = despesas.filter(d => d.mesAno === mesFiltro);
            
            const lista = document.getElementById('lista-despesas');
            lista.innerHTML = '';
            
            let total = 0;
            let maiorGasto = 0;
            const labelsGrafico = [];
            const dadosGrafico = [];
            const coresGrafico = [];

            despesasFiltradas.forEach((d) => {
                const li = document.createElement('li');
                
                li.innerHTML = `
                    <div class="item-info">
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                            <span style="width: 10px; height: 10px; background-color: ${d.cor || '#2563eb'}; border-radius: 50%; display: inline-block;"></span>
                            <span class="item-desc" style="margin-bottom:0;">${d.desc}</span>
                        </div>
                        <span class="badge-cat">${d.categoria || 'Outros'}</span>
                    </div>
                    <div class="item-actions">
                        <span class="item-val">R$ ${formatarMoeda(d.valor)}</span>
                        <button class="btn-delete" title="Apagar Gasto" onclick="apagarItem('${d.id}', '${d.nomeOriginal}')">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                        </button>
                    </div>
                `;
                lista.appendChild(li);

                total += d.valor;
                if (d.valor > maiorGasto) maiorGasto = d.valor;
                
                const index = labelsGrafico.findIndex(label => label === d.nomeOriginal);
                if(index === -1) {
                    labelsGrafico.push(d.nomeOriginal);
                    dadosGrafico.push(d.valor);
                    coresGrafico.push(d.cor || '#2563eb');
                } else {
                    dadosGrafico[index] += d.valor;
                }
            });

            const saldoRestante = rendaAtual - total;
            const elSaldo = document.getElementById('kpi-saldo');
            elSaldo.innerText = `R$ ${formatarMoeda(saldoRestante)}`;
            
            const cardSaldo = document.getElementById('card-saldo-container');
            if (saldoRestante < 0) {
                cardSaldo.style.borderLeftColor = '#ef4444';
                elSaldo.style.color = '#ef4444';
            } else {
                cardSaldo.style.borderLeftColor = '#10b981';
                elSaldo.style.color = '#0f172a';
            }

            document.getElementById('kpi-total').innerText = `R$ ${formatarMoeda(total)}`;
            document.getElementById('kpi-qtd').innerText = despesasFiltradas.length;
            document.getElementById('kpi-maior').innerText = `R$ ${formatarMoeda(maiorGasto)}`;

            if(despesasFiltradas.length === 0) {
                lista.innerHTML = '<li style="justify-content:center; color:#94a3b8; border:none;">Nenhum gasto para este mês.</li>';
            }

            atualizarGrafico(labelsGrafico, dadosGrafico, coresGrafico);
        }

        function atualizarGrafico(labels, data, cores) {
            const ctx = document.getElementById('graficoPizza').getContext('2d');
            if(meuGrafico) meuGrafico.destroy(); 

            if(data.length === 0) return;

            meuGrafico = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: cores,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' }
                    }
                }
            });
        }
    </script>
</body>
</html>
